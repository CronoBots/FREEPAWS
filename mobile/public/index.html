<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Ajout à l’écran d’accueil (PWA) : la barre d’état prend la couleur crème de l’app (theme-color)
      au lieu de rester blanche, avec l’heure et la batterie en foncé (style « default »).
    -->
    <meta name="theme-color" content="#faf1e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FreePaws" />
    <!-- %APP_BASE% = sous-dossier de publication, remplacé par scripts/export-web.sh. -->
    <link rel="apple-touch-icon" href="%APP_BASE%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%APP_BASE%/icon-192.png" />
    <link rel="manifest" href="%APP_BASE%/manifest.webmanifest" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #faf1e7;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>JavaScript est nécessaire pour utiliser l’application FreePaws.</noscript>
    <div id="root"></div>
  </body>
</html>
